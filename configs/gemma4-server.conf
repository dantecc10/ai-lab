# Gemma 4 Server Configuration
# Edit this file to change model/settings

# Model path
MODEL_PATH=/home/darkseid/llama.cpp/ai-models/gemma-4-12b-it-Q4_K_M.gguf

# GPU layers (-ngl): 0=CPU only, 99=all to GPU
# E4B: 99 | 12B: 30 | 26B: 0 (CPU-only)
NGL=30

# Server settings
HOST=0.0.0.0
PORT=9090

# --- Swap Mode ---
# USE_SWAP: true = usar swap para más contexto
#           false = contexto mínimo (sin swap)
# SWAP_AGGRESSIVE: true = usa toda la swap (sin hibernación)
#                  false = reserva swap para hibernación
USE_SWAP=true
SWAP_AGGRESSIVE=false

# CTX_SIZE: Tamaño del contexto según el modo
CTX_SIZE_NORMAL=16384        # Sin swap: ~7GB RAM, hibernación disponible
CTX_SIZE_SWAP=32768          # Con swap: ~14GB RAM+Swap, hibernación disponible
CTX_SIZE_AGGRESSIVE=65536    # Agresivo: ~28GB RAM+Swap, sin hibernación

# SWAP_WARN: Mostrar advertencia al usar modo agresivo
SWAP_WARN=true

# Contexto efectivo (se calcula automáticamente)
CTX_SIZE=16384

# Extra args (optional)
EXTRA_ARGS=
