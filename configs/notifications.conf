[notify]
# Habilitar/deshabilitar notificaciones automáticas
enabled = true

# Cooldown entre notificaciones (segundos)
cooldown = 2

# Notificar en errores
on_error = true

# Notificar al ejecutar tools (crear, modificar, eliminar)
on_execute = true

# Notificar en tareas largas (segundos)
on_long_task = true
long_task_seconds = 5

# Tools que NUNCA notifican (lectura/solo consulta)
exclude_tools = get_system_info, get_gpu_status, list_directory, file_info, search_files, read_file, memory_search, memory_context, memory_list, monitor_realtime, monitor_top_processes, disk_usage, disk_io, network_info, network_ping, network_ports, network_speed, process_list, cron_list, audio_list_devices, docker_ps, docker_logs, docker_images, spotify_now, spotify_playlists, git_status, git_log, git_diff, git_branches, gh_repos_list, gh_repo_info, gh_issues_list, gh_pr_list, gh_actions_list, gh_release_list, gh_gist_list, code_analyze, code_count_lines, project_dependencies, project_structure, ssh_list_hosts, ssh_status, dns_lookup, ssl_check, whois_lookup, data_analysis, log_analysis, browse_web, search_docs, search_news, sql_query, search_google, search_sports, fetch_article, search_with_content

# Tools que SÍ notifican (escritura/acción)
include_tools = send_notification, notify_contextual, memory_save, memory_delete, chat_create, chat_edit, chat_delete, chat_share, token_revoke, email_send, email_configure, email_test, email_discover_settings, email_setup_wizard, ssh_connect, ssh_copy, ssh_fetch, ssh_sync, ssh_tunnel, ssh_add_host, git_commit, git_push, git_pull, git_clone, process_kill, cron_add, cron_delete, run_command, write_file, file_compress, file_extract, file_permissions, system_shutdown, spotify_play, spotify_pause, spotify_next, spotify_previous, spotify_volume, spotify_play_track, spotify_play_artist, spotify_play_playlist, delegate_to_subagent, open_url, run_python_script, screenshot, clipboard, weather, timer, notes, media_control, kasa_set_plug_state, convert_file, csv_to_json, json_to_csv, extract_pdf, generate_csv, backup_database, http_request, security_audit, secret_detection, plan_tasks, generate_report, format_whatsapp, whatsapp_link, format_email
