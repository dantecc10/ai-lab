# AI Lab — Políticas de Seguridad y Control de Ejecución (Guardrails)

[general]
# Modo general de seguridad: strict, standard, permissive
security_mode = standard
# Requerir confirmación para herramientas de alto riesgo en modo interactivo
require_confirmation_high_risk = true
# Bloquear patrones destructivos irreversibles en comandos
block_dangerous_patterns = true

[risk_levels]
# Herramientas de solo lectura y bajo impacto (ejecución libre)
safe = [
    "list_directory", "file_info", "search_files", "read_file", "get_system_info",
    "get_gpu_status", "web_search", "open_url", "media_control", "spotify_search",
    "spotify_now", "spotify_playlists", "weather", "timer", "notes", "memory_search",
    "memory_context", "memory_list", "network_ping", "network_ports", "network_speed",
    "network_info", "process_list", "process_search", "cron_list", "audio_list_devices",
    "monitor_realtime", "monitor_top_processes", "disk_usage", "disk_io", "gh_repos_list",
    "gh_repo_info", "gh_issues_list", "gh_pr_list", "gh_actions_list", "gh_actions_runs",
    "gh_release_list", "gh_gist_list", "gh_search_repos", "gh_search_code", "git_status",
    "git_log", "git_diff", "git_branches", "code_analyze", "code_count_lines",
    "code_search_pattern", "project_dependencies", "project_structure", "docker_ps",
    "docker_logs", "docker_images", "chat_list_shared", "chat_get_shared", "media_view",
    "r2_list", "r2_status", "email_test", "email_discover_settings", "ssh_list_hosts",
    "ssh_status", "browse_web", "http_request", "search_news", "search_docs", "dns_lookup",
    "ssl_check", "whois_lookup", "sql_query", "extract_pdf", "data_analysis", "log_analysis",
    "plan_tasks", "kasa_get_plugs_status", "search_google", "search_sports", "fetch_article",
    "search_with_content", "osint_username", "osint_email", "osint_domain", "osint_ip",
    "osint_person", "audit_get_metrics", "audit_list_traces", "workflow_list", "workflow_status",
    "vector_search", "vector_stats", "browser_extract_text", "browser_screenshot", "browser_status",
    "browser_extract_markdown", "browser_print_pdf", "browser_get_links", "browser_list_tabs",
    "voice_status", "vision_analyze_image", "vision_inspect_screen", "vision_ocr",
    "desktop_context_explain", "desktop_list_monitors", "desktop_list_windows",
    "desktop_capture_region", "audio_check_volume", "voice_list_profiles",
    "football_search_matches", "football_get_match", "football_live_scores",
    "football_get_match_h2h", "football_get_match_lineups", "football_get_match_shotmap",
    "football_get_match_incidents", "football_search_teams", "football_get_team",
    "football_get_team_fixtures", "football_search_players", "football_get_player",
    "football_get_player_stats", "football_get_standings", "football_list_leagues",
    "football_list_seasons", "football_compare_odds", "football_get_predictions",
    "football_list_venues", "football_list_referees",
    "email_list", "email_read", "email_search", "email_folders", "email_mark_read",
    "audit_metrics", "audit_recent", "audit_search", "audit_security", "audit_errors",
    "audit_tool_timeline", "audit_rotate"
]

# Herramientas de modificación de bajo/medio impacto (notificación y logging)
medium = [
    "write_file", "send_notification", "notify_contextual", "spotify_play", "spotify_pause",
    "spotify_next", "spotify_previous", "spotify_volume", "spotify_launch",
    "spotify_play_track", "spotify_play_artist", "spotify_play_playlist", "clipboard",
    "brightness", "memory_save", "memory_delete", "file_compress", "file_extract",
    "audio_set_source", "audio_set_source_input", "gh_issue_create", "gh_gist_create",
    "git_commit", "chat_export", "chat_share", "r2_upload", "r2_delete", "email_configure",
    "email_setup_wizard", "format_whatsapp", "whatsapp_link", "format_email", "backup_database",
    "csv_to_json", "json_to_csv", "convert_file", "generate_csv", "generate_report",
    "kasa_set_plug_state", "delegate_to_subagent", "workflow_run", "vector_index_path",
    "vector_remember", "browser_navigate", "browser_click", "browser_type",
    "browser_sync_brave_profile", "browser_clear_session", "voice_speak", "voice_listen",
    "audio_set_volume", "voice_set_profile", "voice_conversational_turn",
    "email_delete"
]

# Herramientas de alto impacto o ejecución en host (requieren confirmación o análisis de riesgo)
high_risk = [
    "run_command", "run_python_script", "system_shutdown", "process_kill", "cron_add",
    "cron_delete", "gh_repo_create", "gh_pr_create", "gh_pr_merge", "git_push",
    "git_pull", "git_clone", "file_permissions", "email_send", "ssh_connect",
    "ssh_copy", "ssh_fetch", "ssh_sync", "ssh_tunnel", "ssh_add_host", "security_audit",
    "secret_detection"
]

[dangerous_command_patterns]
# Patrones bloqueados de manera preventiva en comandos de shell
patterns = [
    "rm\\s+-rf\\s+/(?:$|\\s|\\*)",
    ":\\(\\){\\s*:\\|:&\\s*};:",
    "mkfs\\.",
    "dd\\s+if=.*of=/dev/(?:sd[a-z]|nvme[0-9]n[0-9]|dm-[0-9])",
    ">\\s*/dev/sd[a-z]",
    ">\\s*/dev/nvme",
    "chmod\\s+-R\\s+777\\s+/(?:$|\\s)",
    "rm\\s+-rf\\s+/boot",
    "rm\\s+-rf\\s+/etc"
]
