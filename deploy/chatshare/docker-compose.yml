# ChatShare VPS - Docker Compose
# Este archivo va en el VPS: ~/chatshare/deploy/docker-compose.yml

services:
  chatshare:
    build: .
    container_name: chatshare
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chatshare_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app/data/chats.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  chatshare_data:
